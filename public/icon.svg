<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#111c38"/>
      <stop offset="60%" stop-color="#0a1020"/>
      <stop offset="100%" stop-color="#060a14"/>
    </radialGradient>

    <!-- Emerald / Mint Gradient -->
    <linearGradient id="mintGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="40%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#4eecd2"/>
    </linearGradient>

    <!-- Cyan / Blue Leaf Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Warm Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="40%" stop-color="#d97706"/>
      <stop offset="75%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>

    <!-- Arrow Gradient -->
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="35%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#5eead4"/>
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Icon Base Surface -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)"/>

  <!-- Subtle ambient glow circle behind emblem -->
  <circle cx="256" cy="180" r="140" fill="#10b981" opacity="0.08" filter="url(#softGlow)"/>

  <!-- ================= EMBLEM GROUP ================= -->
  <g id="emblem">
    <!-- Outer Upper-Left Ring Arc (Emerald to Cyan) -->
    <path d="M 182 195 C 168 152, 190 100, 245 84 C 278 74, 318 84, 342 110" 
          stroke="url(#mintGrad)" stroke-width="14" stroke-linecap="round" fill="none"/>

    <!-- Outer Right Gold Crescent Arc -->
    <path d="M 334 145 C 354 185, 350 232, 318 262 C 298 280, 270 286, 252 284 C 275 278, 308 260, 324 234 C 338 210, 338 175, 334 145 Z" 
          fill="url(#goldGrad)"/>

    <!-- Bottom Left Cyan Organic Leaf -->
    <path d="M 174 212 C 160 238, 172 268, 206 280 C 234 290, 256 270, 250 248 C 232 232, 198 222, 174 212 Z" 
          fill="url(#cyanGrad)"/>
    <path d="M 178 218 Q 212 245 244 252" 
          stroke="#0e7490" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7"/>

    <!-- Bottom Center Emerald Growth Leaf -->
    <path d="M 230 252 C 248 282, 280 282, 296 256 C 290 236, 264 232, 246 242 C 238 246, 233 249, 230 252 Z" 
          fill="url(#mintGrad)"/>
    <path d="M 240 255 Q 262 265 285 254" 
          stroke="#065f46" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>

    <!-- The Central Dollar Sign ($) -->
    <!-- Vertical Dollar Spine -->
    <path d="M 256 72 L 256 230" 
          stroke="url(#mintGrad)" stroke-width="15" stroke-linecap="round"/>
    
    <!-- Dollar 'S' Curve -->
    <path d="M 292 112 C 292 94, 276 84, 256 84 C 232 84, 218 96, 218 114 C 218 135, 236 144, 258 150 C 284 157, 302 167, 302 190 C 302 214, 282 226, 256 226 C 230 226, 214 214, 214 195" 
          stroke="url(#mintGrad)" stroke-width="18" stroke-linecap="round" fill="none"/>

    <!-- Financial Growth Trend Line & Surge Arrow -->
    <path d="M 170 238 L 210 196 L 244 226 L 344 116" 
          stroke="url(#arrowGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- Arrow Head pointing sharply up-right (↗) -->
    <path d="M 302 114 L 350 110 L 346 158" 
          stroke="url(#arrowGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- ================= TYPOGRAPHY GROUP ================= -->
  <!-- "Fin Fácil" -->
  <g id="brand-text">
    <text x="256" y="385" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="64" letter-spacing="-1">
      <tspan fill="#ffffff">Fin </tspan>
      <tspan fill="url(#mintGrad)">Fá</tspan>
      <tspan fill="url(#goldGrad)">cil</tspan>
    </text>

    <!-- "App" Subtitle -->
    <text x="256" y="440" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="34" fill="#94a3b8" letter-spacing="4">
      App
    </text>
  </g>
</svg>
